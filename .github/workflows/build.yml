name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Test Python fallbacks (no Rust)
        run: python -c "import sys; sys.path.insert(0, '.'); exec(open('.github\\workflows\\test_fallbacks.py').read())"

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - run: pip install -r requirements.txt

      - name: Build Rust core
        run: python -m maturin develop --release --manifest-path zametka-core/Cargo.toml

      - name: Build app with PyInstaller
        run: python -m PyInstaller Zametka.spec --clean --noconfirm

      - name: Build installer with PyInstaller
        run: python -m PyInstaller installer/installer.py --onefile --windowed --icon=assets/app_icon.ico --name Zametka-Installer --distpath dist

      - name: Create release zip
        run: |
          Compress-Archive -Path dist/Zametka/*,dist/Zametka.exe -DestinationPath Zametka-Latest.zip -Force

      - name: Generate SHA256
        run: |
          $hash = (Get-FileHash -Path Zametka-Latest.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path Zametka-Latest.zip.sha256 -Value $hash

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Zametka-Latest.zip
            Zametka-Latest.zip.sha256
            dist/Zametka-Installer.exe
          generate_release_notes: true